[build]
  command = "npm ci && npm run build"
  publish = "dist"
  base = "."
  ignore = "false"

[build.environment]
  NODE_VERSION = "20"
  CI = "true"

[build.processing]
  skip_processing = false

[dev]
  command = "vite"
  port = 3000
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"